<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; background:#F7F7F7; padding:32px; color:#1F2A33;">
  <div style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:12px; padding:32px;">
    <h2 style="color:#0A4D68;">Reset Your Password</h2>
    <p>Hi {{ user.full_name.split(' ')[0] }},</p>
    <p>We received a request to reset your LuxStay Hotel password. Click the button below to choose a new one. This link expires in 1 hour.</p>
    <p style="text-align:center; margin:32px 0;">
      <a href="{{ reset_url }}" style="background:#C8A96A; color:#1F2A33; padding:12px 28px; border-radius:6px; text-decoration:none; font-weight:600;">Reset Password</a>
    </p>
    <p>If you didn't request this, you can safely ignore this email.</p>
    <p style="color:#8A8A8A; font-size:13px;">LuxStay Hotel &amp; Resort</p>
  </div>
</body>
</html>
