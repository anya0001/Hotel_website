{% extends "base.html" %}
{% block title %}File Too Large — {{ HOTEL_NAME }}{% endblock %}
{% block content %}
<section class="section error-page">
  <div class="container container--narrow">
    <p class="error-page__code">413</p>
    <h1>File Too Large</h1>
    <p>The file you uploaded exceeds our 8 MB limit. Please try a smaller image.</p>
    <a href="{{ url_for('hotel.home') }}" class="btn btn--primary">Back to Home</a>
  </div>
</section>
{% endblock %}
